<html>
  <head>
      <meta charest="UTF-8">
      <title>一个不知名网站</title>
      <style>
        body{font-family:SimSun,serif;
                  color:#333333;
                  text-align:center;}
        #myText{font-size:24px;
                       font-weight:bold;}

        button{margin:10px 5px;
                    padding:8px 16px;
                    font-size:16px;
                    cursor:pointer;} 
        body{background:url("背景.jpg.png")no-repeat center;
                 background-size:cover;}
      </style>
  </head>
  <body>
      <i><b><h1>你好</b></i>
      <p>欢迎来到lyc的网站</p><br>
         <p  id="num">0</p>
         <button type="button" onclick="addOne()">点击此处有惊喜</button><br>
     <p id="myText">快来点一下我吧</p>
     <button id="myBtn"type="button"onclick="changeText()">没错，就是我</button>
      </body>
      <script>
          var count=0;
          function addOne(){count=count+1;
          document.getElementById("num").textContent=count;}
       var step=0;
       function changeText(){
             var text=document.getElementById("myText");
             var btn=document.getElementById("myBtn");
        if(step==0){text.textContent="嘿我是你爹!";
                            btn.textContent="再点一下呗";
                            step=1;}
        else if(step==1){text.textContent="你不会以为我会改吧";
                                   btn.textContent="大傻瓜!";
                                   step=2;}
        else{text.textContent="快来点一下我吧";
                btn.textContent="没错，就是我";
                step=0;}
        }
      </script>
</html>
